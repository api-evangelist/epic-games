aid: epic-games
name: Epic Games
description: Epic Games is the studio behind Fortnite, the Unreal Engine, the Epic
  Games Store, MetaHuman, RealityScan, Twinmotion, RAD Game Tools, and the Epic Online
  Services (EOS) backend. Epic operates a unified developer portal at dev.epicgames.com
  that hosts the EOS SDK and REST APIs (Auth, Connect, Friends, Presence, Lobby, Sessions,
  Achievements, Stats, Leaderboards, Player Data Storage, Title Storage, Voice, Sanctions,
  Anti-Cheat, Reports, P2P, Ecom, User Info), the Unreal Engine documentation, the
  Epic Games Store publishing tools, and the Kids Web Services (KWS) compliance platform.
  EOS is cross-platform and runs on Windows, macOS, Linux, PlayStation, Xbox, Switch,
  iOS, Android, and web. This profile rolls Epic's developer-facing surfaces into
  a single index; the Unreal Engine surface has its own dedicated profile.
