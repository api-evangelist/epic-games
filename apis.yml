- aid: epic-games:epic-account-services
  name: Epic Account Services
  description: Epic Account Services provides OAuth 2.0 / OIDC sign-in with an Epic Account, exposing user identity,
    display name, country, preferred language, and linked-account information to integrating games and tools. It
    powers cross-platform Epic login and is the identity layer underneath EOS Auth.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.epicgames.com/docs/epic-account-services
  baseURL: https://api.epicgames.dev
