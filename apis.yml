apis:
- aid: epic-games:epic-online-services
  name: Epic Online Services (EOS)
  description: Epic Online Services is Epic's free cross-platform backend for games.
    EOS exposes both a native C/C++ SDK (with Unity, Unreal, and platform wrappers)
    and a set of REST web services covering identity (Epic Account Services, Connect,
    Auth), social (Friends, Presence, Blocklist), play (Lobby, Sessions, P2P, Voice),
    progression (Achievements, Stats, Leaderboards), storage (Player Data Storage,
    Title Storage), integrity (Anti-Cheat, Sanctions, Reports), and commerce (Ecom).
    All EOS APIs are gated behind an Epic developer organization, sandbox, and client
    credentials issued in the EOS Developer Portal.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.epicgames.com/en-US/services/epic-online-services
  baseURL: https://api.epicgames.dev
  tags:
