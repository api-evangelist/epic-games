- aid: epic-games:epic-games-store-publishing
  name: Epic Games Store Publishing
  description: The Epic Games Store publishing surface lets developers upload builds, configure store pages, manage
    offers, run sales, and integrate with EOS achievements and entitlements. Publishing tools include the BuildPatchTool
    / EOS SDK Tool for uploading builds and a developer portal for managing products. There is no fully self-serve
    public REST Store API; publishing is gated through Epic's onboarding.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.epicgames.com/en-US/store
  baseURL: https://dev.epicgames.com
  tags:
  - Builds
  - Entitlements
  - Publishing
  - Store
  properties:
  - type: Portal
    url: https://dev.epicgames.com/en-US/store
  - type: Documentation
    url: https://dev.epicgames.com/docs/epic-games-store
- aid: epic-games:kids-web-services
  name: Kids Web Services (KWS)
  description: Kids Web Services is Epic's compliance and parental-verification platform for games and online services
    that handle children's data. KWS exposes REST APIs and an SDK for age verification, parental consent collection
    (COPPA, GDPR-K, age-appropriate design code), account linking, and consent revocation flows.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kidswebservices.com
  baseURL: https://kidswebservices.com
